# 4G here starved the Dart AOT compiler, which Gradle launches as a child
# process during :app:compileFlutterBuildRelease. On an 8GB machine that
# crashed with "Could not start thread DartWorker". Gradle's own tasks fit
# comfortably in 2G for this project.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental compilation disabled - causes cross-drive path errors on Windows
# when Pub cache is on C:\ and project is on D:\
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.multiplatform=false
# Gradle daemon and parallel builds
# parallel disabled: was racing with Flutter's plugin afterEvaluate() hooks,
# causing "Cannot run Project.afterEvaluate(Action) when the project is
# already evaluated" in com.flutter.gradle.plugins.PluginHandler
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false
# Force classic, strictly-ordered project configuration. If isolated-projects
# or configure-on-demand is enabled anywhere (locally or in ~/.gradle/gradle.properties),
# Gradle can evaluate plugin subprojects (e.g. agora_rtc_engine) before :app,
# which is what triggers "Cannot run Project.afterEvaluate... already evaluated".
org.gradle.configureondemand=false
org.gradle.unsafe.isolated-projects=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
