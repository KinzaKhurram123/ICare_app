workflows:

  android-apk:
    name: Android APK
    max_build_duration: 60

    environment:
      flutter: 3.44.0

    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk


  ios-app-store:
    name: iOS App Store
    max_build_duration: 120

    integrations:
      app_store_connect: RMHealth

    environment:
      flutter: 3.44.0
      xcode: 26.4

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cartzlinkv2.icare

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        # --build-name is deliberately not passed: hard-coding it meant every
        # build shipped as 1.0.0 whatever pubspec.yaml said, and App Store
        # Connect rejects a version no higher than the one already submitted
        # (1.0.2). Flutter reads pubspec.yaml instead.
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Without this the build reaches App Store Connect but never lands
        # on any tester's device.
        submit_to_testflight: true
        submit_to_app_store: false